<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Svarkor AI OS — Tavlor (läs-vy)</title>
  <meta name="description" content="Publik läs-vy över Svarkor AI OS Mission Control-tavla (Orkestrator): projektträd, beroenden, kö och verifiering. Endast läsning, ingen känslig data." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="static/css/app.css?v=4635bf4c" />
</head>
<body>
  <a class="skip-link" href="#main">Hoppa till innehåll</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">◈</span>
        <span class="brand__name">Svarkor <strong>AI&nbsp;OS</strong></span>
        <span class="brand__phase">tavlor · läs-vy</span>
      </div>

      <!-- Board switch: the board(s) the current boards.json carries; one board is served today -->
      <nav class="board-switch" aria-label="Välj tavla">
        <button type="button" class="board-pill is-active" id="board-orchestrator" data-board="orchestrator" aria-pressed="true">Orkestrator</button>
        <button type="button" class="board-pill" id="board-svarkor" data-board="svarkor" aria-pressed="false">Svarkor</button>
      </nav>
    </div>

    <nav class="tabs" aria-label="Vy" role="tablist">
      <button type="button" class="tab is-active" id="tab-projekt" role="tab" aria-selected="true" data-tab="projekt">Projekt</button>
      <button type="button" class="tab" id="tab-beroenden" role="tab" aria-selected="false" data-tab="beroenden">Beroenden</button>
      <button type="button" class="tab" id="tab-ko" role="tab" aria-selected="false" data-tab="ko">Kö</button>
      <button type="button" class="tab" id="tab-verifiering" role="tab" aria-selected="false" data-tab="verifiering">Verifiering</button>
    </nav>
  </header>

  <main id="main" class="page">
    <div id="meta-bar" class="meta-bar" aria-live="polite"></div>

    <section id="panel-projekt" class="panel" data-tab="projekt" aria-labelledby="tab-projekt">
      <div id="projekt-body" class="panel__body"></div>
    </section>
    <section id="panel-beroenden" class="panel" data-tab="beroenden" aria-labelledby="tab-beroenden" hidden>
      <div id="beroenden-body" class="panel__body"></div>
    </section>
    <section id="panel-ko" class="panel" data-tab="ko" aria-labelledby="tab-ko" hidden>
      <div id="ko-body" class="panel__body"></div>
    </section>
    <section id="panel-verifiering" class="panel" data-tab="verifiering" aria-labelledby="tab-verifiering" hidden>
      <div id="verifiering-body" class="panel__body"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Svarkor AI OS · Publik läs-vy över Mission Control-tavlan · Endast läsning, inga ändringar utförs · Känsliga projekt och all känslig data är bortfiltrerade på servern.</p>
  </footer>

  <!-- the render lib: six concern files in dependency order (render-core first;
       render-verify reuses render-queue's row lists), then the shell (MC 11525 C1) -->
  <script src="static/js/render-core.js?v=f3d2c0fd"></script>
  <script src="static/js/render-data.js?v=375fc09f"></script>
  <script src="static/js/render-projects.js?v=d3ed7870"></script>
  <script src="static/js/render-queue.js?v=4a4db656"></script>
  <script src="static/js/render-verify.js?v=42c97548"></script>
  <script src="static/js/render-deps.js?v=6af234eb"></script>
  <script src="static/js/app.js?v=f78501fc"></script>
</body>
</html>
